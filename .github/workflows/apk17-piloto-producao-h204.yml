name: APK 18 Camera Corrigida

on:
  workflow_dispatch:
  push:
    branches:
      - build/ponto-h204-camera-fix-apk18
    paths:
      - ".github/workflows/apk17-piloto-producao-h204.yml"
      - "apps/ponto-obra/**"
      - "server/ponto-eletronico/**"
      - "src/domains/ponto-eletronico/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: apk18-camera-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk-piloto-producao:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PONTO_AMBIENTE: producao
      PONTO_API_URL: https://pontosarcd.vercel.app/api/data
      PONTO_VERSION_CODE: "18"
      PONTO_PRODUCAO_PILOTO_VARIANT: h204fix
      PONTO_ANDROID_ARCHITECTURES: arm64-v8a
      PONTO_GRADLE_WORKERS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      EXPO_NO_TELEMETRY: "1"
      NODE_ENV: production
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/ponto-obra/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias da raiz
        run: npm ci --ignore-scripts --include=dev

      - name: Instalar dependencias do app
        working-directory: apps/ponto-obra
        run: npm ci --ignore-scripts

      - name: Instalar SDK/NDK Android homologados
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Baixar e conferir FaceNet-512
        working-directory: apps/ponto-obra
        run: node scripts/garantir-modelo-facenet.mjs

      - name: Restaurar chave persistente da camera corrigida
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PONTO_CAMERA_FIX_KEYSTORE_B64 }}
          SIGNING_JSON: ${{ secrets.PONTO_CAMERA_FIX_SIGNING_JSON }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const path=require("path");const dir=process.env.RUNNER_TEMP;const signing=JSON.parse(process.env.SIGNING_JSON);signing.path=path.join(dir,"ponto-camera-fix.jks");fs.writeFileSync(signing.path,Buffer.from(process.env.KEYSTORE_B64,"base64"),{mode:0o600});fs.writeFileSync(path.join(dir,"ponto-camera-fix-signing.json"),JSON.stringify(signing),{mode:0o600});'
          echo "PONTO_SIGNING_FILE=$RUNNER_TEMP/ponto-camera-fix-signing.json" >> "$GITHUB_ENV"

      - name: Testes do terminal autonomo e cadastro global
        run: npx vitest run apps/ponto-obra

      - name: Compilar e verificar APK 18 Camera Corrigida
        working-directory: apps/ponto-obra
        run: node scripts/build-apk-homologacao.mjs --version-code 18 --output quality-out/camera-fix

      - name: Resumo do artefato
        working-directory: apps/ponto-obra
        run: |
          cat quality-out/camera-fix/ponto-obra-piloto-producao-18.json
          cat quality-out/camera-fix/ponto-obra-piloto-producao-18.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: marcell-ponto-camera-fix-apk18
          path: |
            apps/ponto-obra/quality-out/camera-fix/ponto-obra-piloto-producao-18.apk
            apps/ponto-obra/quality-out/camera-fix/ponto-obra-piloto-producao-18.json
            apps/ponto-obra/quality-out/camera-fix/ponto-obra-piloto-producao-18.apk.sha256
          if-no-files-found: error
          retention-days: 7

