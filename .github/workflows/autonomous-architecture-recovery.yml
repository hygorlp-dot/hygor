name: Autonomous Architecture Recovery

on:
  push:
    branches:
      - refactor/architecture-recovery-v1

permissions:
  contents: write

jobs:
  patch-stale-e2e-contract:
    if: ${{ !contains(github.event.head_commit.message, '[architecture-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebind stale Compras smoke contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/modules-smoke.spec.js')
          source = path.read_text(encoding='utf-8')
          old = 'await page.getByRole("button",{name:"CRIAR ITEM PRÓPRIO"}).click();'
          new = 'await page.getByRole("button",{name:"Adicionar somente a esta solicitação"}).click();'
          if old not in source:
              raise SystemExit('expected stale selector not found; refusing non-deterministic patch')
          if source.count(old) != 1:
              raise SystemExit('stale selector is not unique; refusing patch')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/autonomous-architecture-recovery.yml
      - name: Commit deterministic patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/modules-smoke.spec.js
          git commit -m "test: rebind Compras smoke to current UI [architecture-autofix]"
          git push origin HEAD:refactor/architecture-recovery-v1
