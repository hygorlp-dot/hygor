name: Qualidade

on:
  push:
    branches: [main]
  pull_request:

jobs:
  financial-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes financeiros e de permissões com cobertura
        run: npm run test:coverage
      - name: Build de produção
        run: npm run build
      - name: Métricas de bundle
        run: npm run quality:bundle
      - name: Auditoria de vulnerabilidades
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metricas-de-qualidade
          path: |
            bundle-metrics.json
            coverage/coverage-summary.json
