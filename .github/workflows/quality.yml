name: Qualidade

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  financial-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fronteiras de domínio e financeiro
        run: npm run lint
      - name: Fronteiras arquiteturais
        run: npm run architecture:check
      - name: Typecheck progressivo
        run: npm run typecheck
      - name: Testes financeiros e de permissões com cobertura
        run: npm run test:coverage
      - name: Build de produção
        run: npm run build
      - name: Catálogo isolado do Design System
        run: npm run build-storybook
      - name: Métricas de bundle
        run: npm run quality:bundle
      - name: Auditoria de vulnerabilidades
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metricas-de-qualidade
          path: |
            bundle-metrics.json
            coverage/coverage-summary.json
            storybook-static

  migration-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contratos das migrations e integração financeira
        run: npm test -- src/integration/financial-transaction-migration.test.js src/integration/auth-rate-limit-migration.test.js src/integration/audit-migration.test.js server/financial-shadow.test.js server/reconciliation-command.test.js
      - name: Contratos das migrations do Ponto de Obra (016 legado + 017 ARP/NSR por estabelecimento + 018 apropriação por obra)
        run: npx vitest run server/ponto-eletronico-migration.pglite.test.js server/ponto-eletronico/arp/arp-migration.pglite.test.js server/ponto-eletronico/arp/arp-migration-caminhos.pglite.test.js server/ponto-eletronico/arp/handler-arp.pglite.test.js server/ponto-eletronico/apropriacao-migration.pglite.test.js
      - name: Contrato da migration 019 (schema public fechado para anon/authenticated)
        run: npx vitest run server/acesso-publico-migration.pglite.test.js server/manutencao-banco-migration.pglite.test.js
      - name: Sintaxe da fronteira de API
        run: node --check api/data.js

  # App Android "Ponto de Obra" (Expo, apps/ponto-obra). Só impede regressão:
  # NÃO compila nem publica APK (isso é feito à mão na EAS, perfil "piloto").
  # Tudo passa pelo release-check (o mesmo que se roda antes de um build):
  # testes (app, domínio, servidor, migrations), expo-doctor, bundle com os
  # 2 .tflite, prebuild + verificar-prebuild, versões e o scorecard objetivo
  # (scripts/mobile-quality-score.mjs). Bloqueia por P0, gate crítico
  # reprovado, evidência ausente e regressão contra quality/baseline.json.
  # Estética subjetiva não bloqueia.
  mobile-ponto-obra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/ponto-obra/package-lock.json
      - name: Instalação limpa do app
        working-directory: apps/ponto-obra
        run: npm ci
      - name: Instalação da raiz (testes compartilhados)
        run: npm ci
      - name: Release check + scorecard (doctor, bundle, prebuild, testes, gates de UX/segurança/REP-P)
        run: npm run mobile:release-check -- --ci
      - name: Relatório de qualidade (artifact mobile-quality-report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-quality-report
          path: |
            apps/ponto-obra/quality-out/mobile-quality-report.json
            apps/ponto-obra/quality-out/mobile-quality-report.md
            apps/ponto-obra/quality-out/evidencias.json
          if-no-files-found: warn

  # REP-P: atribuição de NSR com conexões REALMENTE simultâneas num Postgres
  # de verdade (o PGlite dos outros testes tem uma conexão só).
  rep-p-arp-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ponto
          POSTGRES_PASSWORD: ponto
          POSTGRES_DB: ponto_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ponto -d ponto_teste"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PONTO_PG_URL: postgres://ponto:ponto@localhost:5432/ponto_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Concorrência real da ARP (NSR único, idempotência, rollback)
        run: npx vitest run server/ponto-eletronico/arp/arp-concorrencia.pg.test.js
      - name: Gravação de jsonb pelo driver postgres (objeto, não texto)
        run: npx vitest run server/jsonb-gravacao.test.js server/orcamentos-linha-propria.pg.test.js
      - name: Confere que o teste rodou (não foi pulado)
        run: npx vitest run server/ponto-eletronico/arp/arp-concorrencia.pg.test.js --reporter=json --outputFile=concorrencia.json && node -e "const r=require('./concorrencia.json'); if (r.numPassedTests < 5) { console.error('teste de concorrência não rodou'); process.exit(1); }"

  browser-critical-flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium homologado
        run: npx playwright install --with-deps chromium
      - name: Login e Ponto em navegador real
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencias-playwright
          path: |
            playwright-report
            test-results


  # APK experimental FaceNet-512: só nesta branch de homologação.
  # Usa pacote separado e chave efêmera para não tocar nos APKs já instalados.
  apk15-facenet:
    if: github.ref_name == 'feat/face-auth-mit-adapter-d6'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PONTO_AMBIENTE: homologacao
      PONTO_API_URL: https://ponto-homologacao.vercel.app/api/data
      PONTO_VERSION_CODE: "15"
      PONTO_HOMOLOGACAO_VARIANT: facenet
      PONTO_ANDROID_ARCHITECTURES: arm64-v8a
      PONTO_GRADLE_WORKERS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      EXPO_NO_TELEMETRY: "1"
      NODE_ENV: production
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/ponto-obra/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dependências
        run: |
          npm ci --ignore-scripts --include=dev
          cd apps/ponto-obra
          npm ci --ignore-scripts
      - name: Android SDK/NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: FaceNet-512 verificado
        working-directory: apps/ponto-obra
        run: node scripts/garantir-modelo-facenet.mjs
      - name: Assinatura efêmera da variante facenet
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/ponto-facenet-lab.jks"
          SIGNING="$RUNNER_TEMP/ponto-facenet-signing.json"
          PASS="$(openssl rand -hex 24)"
          ALIAS="ponto-facenet-lab"
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias "$ALIAS" -keyalg RSA -keysize 3072 -validity 3650 -storepass "$PASS" -keypass "$PASS" -dname "CN=MARCELL Ponto FaceNet Homologacao, OU=QA, O=MARCELL, C=BR"
          node -e 'const fs=require("fs"); const [p,s,a,k]=process.argv.slice(1); fs.writeFileSync(p,JSON.stringify({path:k,password:s,alias:a,keyPassword:s},null,2));' "$SIGNING" "$PASS" "$ALIAS" "$KEYSTORE"
          chmod 600 "$KEYSTORE" "$SIGNING"
          echo "PONTO_SIGNING_FILE=$SIGNING" >> "$GITHUB_ENV"
      - name: Testes focais
        run: npx vitest run apps/ponto-obra/src/logica/fluxo-facial-direto.test.js apps/ponto-obra/src/logica/rosto.test.js apps/ponto-obra/src/logica/diagnostico-calibracao.test.js apps/ponto-obra/src/logica/escala-reconhecimento.test.js apps/ponto-obra/src/logica/regressao.test.js
      - name: Build APK 15
        working-directory: apps/ponto-obra
        run: node scripts/build-apk-homologacao.mjs --version-code 15 --output quality-out/apk15
      - name: Publicar APK 15
        uses: actions/upload-artifact@v4
        with:
          name: marcell-ponto-facenet-apk15
          path: |
            apps/ponto-obra/quality-out/apk15/ponto-obra-homologacao-15.apk
            apps/ponto-obra/quality-out/apk15/ponto-obra-homologacao-15.json
            apps/ponto-obra/quality-out/apk15/ponto-obra-homologacao-15.apk.sha256
          if-no-files-found: error
          retention-days: 7
