name: Qualidade

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  financial-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fronteiras de domínio e financeiro
        run: npm run lint
      - name: Fronteiras arquiteturais
        run: npm run architecture:check
      - name: Typecheck progressivo
        run: npm run typecheck
      - name: Testes financeiros e de permissões com cobertura
        run: npm run test:coverage
      - name: Build de produção
        run: npm run build
      - name: Catálogo isolado do Design System
        run: npm run build-storybook
      - name: Métricas de bundle
        run: npm run quality:bundle
      # Todo advisory high/critical bloqueia. A única exceção é advisory SEM versão
      # corrigida publicada, registrado em scripts/auditoria-excecoes.json com prazo;
      # a exceção se revoga sozinha quando sai a correção (docs/PONTO-OBRA-FASE-01-ESTABILIZACAO.md).
      - name: Auditoria de vulnerabilidades
        run: npm run audit:deps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metricas-de-qualidade
          path: |
            bundle-metrics.json
            coverage/coverage-summary.json
            storybook-static

  migration-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contratos das migrations e integração financeira
        run: npm test -- src/integration/financial-transaction-migration.test.js src/integration/auth-rate-limit-migration.test.js src/integration/audit-migration.test.js server/financial-shadow.test.js server/reconciliation-command.test.js
      - name: Contratos das migrations do Ponto de Obra (016 legado + 017 ARP/NSR por estabelecimento + 018 apropriação)
        run: npx vitest run server/ponto-eletronico-migration.pglite.test.js server/ponto-eletronico/arp/arp-migration.pglite.test.js server/ponto-eletronico/arp/handler-arp.pglite.test.js
      - name: Sintaxe da fronteira de API
        run: node --check api/data.js

  # App Android "Ponto de Obra" (Expo, apps/ponto-obra). Só impede regressão:
  # NÃO compila nem publica APK (isso é feito à mão na EAS, perfil "piloto").
  mobile-ponto-obra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ponto-obra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/ponto-obra/package-lock.json
      - name: Instalação limpa do app
        run: npm ci
      - name: expo-doctor (versões do SDK 57, config, autolinking)
        run: npx expo-doctor
      - name: Bundle Android (Metro + código compartilhado + modelos .tflite)
        run: |
          npx expo export --platform android --output-dir dist-ci
          test "$(grep -o '"ext":"tflite"' dist-ci/metadata.json | wc -l)" -ge 2
      - name: Prebuild Android descartável (SQLCipher, permissões, autolinking)
        run: |
          npx expo prebuild --platform android --no-install --clean
          node scripts/verificar-prebuild.mjs
      - name: Instalação da raiz (testes compartilhados)
        working-directory: .
        run: npm ci
      - name: Testes do Ponto de Obra (app, regras compartilhadas e servidor)
        working-directory: .
        run: npx vitest run apps/ponto-obra src/domains/ponto-eletronico server/ponto-eletronico
      - name: Auditoria de vulnerabilidades do app (mesmo portão da raiz)
        working-directory: .
        run: npm run audit:deps -- apps/ponto-obra

  # REP-P: atribuição de NSR com conexões REALMENTE simultâneas num Postgres
  # de verdade (o PGlite dos outros testes tem uma conexão só).
  rep-p-arp-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ponto
          POSTGRES_PASSWORD: ponto
          POSTGRES_DB: ponto_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ponto -d ponto_teste"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PONTO_PG_URL: postgres://ponto:ponto@localhost:5432/ponto_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Concorrência real da ARP (NSR único, idempotência, rollback)
        run: npx vitest run server/ponto-eletronico/arp/arp-concorrencia.pg.test.js
      - name: Confere que o teste rodou (não foi pulado)
        run: npx vitest run server/ponto-eletronico/arp/arp-concorrencia.pg.test.js --reporter=json --outputFile=concorrencia.json && node -e "const r=require('./concorrencia.json'); if (r.numPassedTests < 5) { console.error('teste de concorrência não rodou'); process.exit(1); }"

  browser-critical-flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium homologado
        run: npx playwright install --with-deps chromium
      - name: Login e Ponto em navegador real
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencias-playwright
          path: |
            playwright-report
            test-results
